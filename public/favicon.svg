<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fav-bg { fill: #3d2817; }
      .fav-bread { fill: #a67c3a; stroke: #6b5428; stroke-width: 0.5; }
      .fav-bread-light { fill: #c9a961; stroke: #8b6f3d; stroke-width: 0.3; }
      .fav-wheat { fill: #d4a855; stroke: #a67c3a; stroke-width: 0.3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" class="fav-bg"/>

  <!-- Frame circle -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a961" stroke-width="0.8" opacity="0.5"/>

  <!-- Small loaves arranged in circle -->
  <!-- Top left bread -->
  <circle cx="32" cy="28" r="9" class="fav-bread" opacity="0.8"/>
  <path d="M 28 24 Q 32 22, 36 24" class="fav-bread-light" opacity="0.6"/>
  <path d="M 28 30 Q 32 33, 36 30" stroke="#5a3f1f" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Top right bread -->
  <ellipse cx="68" cy="32" rx="10" ry="8" class="fav-bread" opacity="0.8"/>
  <path d="M 62 28 Q 68 25, 74 28" class="fav-bread-light" opacity="0.5"/>
  <path d="M 62 34 Q 68 37, 74 34" stroke="#5a3f1f" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Center bread -->
  <ellipse cx="50" cy="50" rx="12" ry="10" class="fav-bread"/>
  <path d="M 42 48 Q 50 45, 58 48" class="fav-bread-light" opacity="0.7"/>
  <path d="M 42 52 Q 50 55, 58 52" stroke="#5a3f1f" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Bottom left bread -->
  <circle cx="30" cy="70" r="9" class="fav-bread" opacity="0.8"/>
  <path d="M 26 66 Q 30 63, 34 66" class="fav-bread-light" opacity="0.5"/>

  <!-- Bottom right bread -->
  <circle cx="70" cy="68" r="8" class="fav-bread" opacity="0.8"/>
  <path d="M 66 64 Q 70 61, 74 64" class="fav-bread-light" opacity="0.5"/>

  <!-- Wheat accents -->
  <g class="fav-wheat">
    <!-- Left wheat -->
    <ellipse cx="15" cy="45" rx="2" ry="3" transform="rotate(-25 15 45)"/>
    <ellipse cx="18" cy="55" rx="2" ry="3" transform="rotate(20 18 55)"/>

    <!-- Right wheat -->
    <ellipse cx="85" cy="40" rx="2" ry="3" transform="rotate(25 85 40)"/>
    <ellipse cx="82" cy="52" rx="2" ry="3" transform="rotate(-20 82 52)"/>
  </g>
</svg>
