<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cream-bg { fill: #f5f1e8; }
      .ornate { fill: #c9a961; stroke: #a67c3a; stroke-width: 0.5; }
      .text-artisan { font-family: 'Brush Script MT', 'Lucida Handwriting', cursive; font-size: 56px; fill: #3d2817; font-style: italic; font-weight: 300; }
      .text-bakery { font-family: 'Georgia', serif; font-size: 48px; fill: #2b1a0f; font-weight: bold; letter-spacing: 2px; }
      .wheat { fill: #d4a855; stroke: #a67c3a; stroke-width: 0.5; }
      .bread { fill: #a67c3a; stroke: #6b5428; stroke-width: 0.8; }
      .bread-light { fill: #c9a961; stroke: #8b6f3d; stroke-width: 0.5; }
      .shadow { fill: #3d2817; opacity: 0.15; }
    </style>

    <!-- Decorative flourish patterns -->
    <symbol id="flourish-left" viewBox="0 0 80 60">
      <path d="M 10 30 Q 25 10, 45 5 Q 50 5, 55 10 Q 40 15, 30 30 Q 40 35, 55 45 Q 50 50, 45 50 Q 25 45, 10 30 Z" class="ornate"/>
      <path d="M 15 28 Q 28 18, 42 15" stroke="#a67c3a" stroke-width="1" fill="none" opacity="0.6"/>
      <circle cx="50" cy="8" r="3" class="ornate"/>
    </symbol>

    <!-- Wheat stalk -->
    <symbol id="wheat-stalk" viewBox="0 0 30 80">
      <path d="M 15 0 Q 14 20, 12 40 Q 10 60, 8 80" stroke="#8b6f3d" stroke-width="1.5" fill="none"/>
      <g class="wheat">
        <ellipse cx="8" cy="15" rx="4" ry="6" transform="rotate(-25 8 15)"/>
        <ellipse cx="9" cy="28" rx="4" ry="6" transform="rotate(-20 9 28)"/>
        <ellipse cx="10" cy="41" rx="4" ry="6" transform="rotate(-15 10 41)"/>
        <ellipse cx="11" cy="54" rx="4" ry="6" transform="rotate(-10 11 54)"/>
        <ellipse cx="12" cy="67" rx="4" ry="6" transform="rotate(-5 12 67)"/>
        <ellipse cx="14" cy="20" rx="4" ry="6" transform="rotate(25 14 20)"/>
        <ellipse cx="16" cy="33" rx="4" ry="6" transform="rotate(20 16 33)"/>
        <ellipse cx="17" cy="46" rx="4" ry="6" transform="rotate(15 17 46)"/>
        <ellipse cx="18" cy="59" rx="4" ry="6" transform="rotate(10 18 59)"/>
        <ellipse cx="19" cy="72" rx="4" ry="6" transform="rotate(5 19 72)"/>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" class="cream-bg"/>

  <!-- Left ornate flourish -->
  <g transform="translate(40, 75)">
    <use href="#flourish-left"/>
  </g>

  <!-- Right ornate flourish (mirrored) -->
  <g transform="translate(760, 75) scale(-1, 1)">
    <use href="#flourish-left"/>
  </g>

  <!-- Left wheat stalks -->
  <g transform="translate(80, 120)">
    <use href="#wheat-stalk"/>
  </g>
  <g transform="translate(120, 110)">
    <use href="#wheat-stalk"/>
  </g>

  <!-- Right wheat stalks -->
  <g transform="translate(720, 120) scale(-1, 1)">
    <use href="#wheat-stalk"/>
  </g>
  <g transform="translate(680, 110) scale(-1, 1)">
    <use href="#wheat-stalk"/>
  </g>

  <!-- Center decorative elements -->
  <!-- Flour sack -->
  <ellipse cx="280" cy="210" rx="35" ry="40" class="bread" opacity="0.8"/>
  <path d="M 255 170 Q 270 165, 285 165 Q 300 165, 305 170" class="bread-light"/>
  <line x1="270" y1="165" x2="260" y2="195" stroke="#8b6f3d" stroke-width="1"/>
  <line x1="300" y1="168" x2="310" y2="190" stroke="#8b6f3d" stroke-width="1"/>

  <!-- Left round bread -->
  <circle cx="360" cy="220" r="42" class="bread"/>
  <path d="M 330 190 Q 360 175, 390 190" class="bread-light" opacity="0.6"/>
  <path d="M 340 210 Q 360 225, 380 210" stroke="#5a3f1f" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="345" cy="200" r="2" fill="#5a3f1f" opacity="0.5"/>
  <circle cx="375" cy="205" r="2" fill="#5a3f1f" opacity="0.5"/>

  <!-- Center oval bread -->
  <ellipse cx="470" cy="230" rx="50" ry="38" class="bread"/>
  <path d="M 430 200 Q 470 180, 510 200" class="bread-light" opacity="0.6"/>
  <path d="M 440 220 Q 470 240, 500 220" stroke="#5a3f1f" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 445 215 Q 470 235, 495 215" stroke="#5a3f1f" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="455" cy="210" r="2.5" fill="#5a3f1f" opacity="0.5"/>
  <circle cx="485" cy="215" r="2.5" fill="#5a3f1f" opacity="0.5"/>

  <!-- Right round bread -->
  <circle cx="580" cy="215" r="40" class="bread"/>
  <path d="M 555 188 Q 580 175, 605 188" class="bread-light" opacity="0.6"/>
  <path d="M 560 205 Q 580 225, 600 205" stroke="#5a3f1f" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Grain scattered -->
  <g fill="#c9a961" opacity="0.6">
    <ellipse cx="300" cy="265" rx="3" ry="5" transform="rotate(45 300 265)"/>
    <ellipse cx="320" cy="270" rx="3" ry="5" transform="rotate(-30 320 270)"/>
    <ellipse cx="340" cy="273" rx="3" ry="5" transform="rotate(60 340 273)"/>
    <ellipse cx="360" cy="275" rx="3" ry="5" transform="rotate(-20 360 275)"/>
    <ellipse cx="440" cy="278" rx="3" ry="5" transform="rotate(40 440 278)"/>
    <ellipse cx="520" cy="280" rx="3" ry="5" transform="rotate(-50 520 280)"/>
    <ellipse cx="560" cy="275" rx="3" ry="5" transform="rotate(25 560 275)"/>
    <ellipse cx="580" cy="270" rx="3" ry="5" transform="rotate(-35 580 270)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="110" class="text-artisan" text-anchor="middle">Artisan</text>
  <text x="400" y="155" class="text-bakery" text-anchor="middle">BAKERY</text>

  <!-- Decorative dots -->
  <circle cx="380" cy="125" r="2" fill="#a67c3a"/>
  <circle cx="420" cy="125" r="2" fill="#a67c3a"/>
  <circle cx="360" cy="167" r="1.5" fill="#a67c3a" opacity="0.7"/>
  <circle cx="440" cy="167" r="1.5" fill="#a67c3a" opacity="0.7"/>
</svg>